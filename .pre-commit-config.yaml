# Shared pre-commit configuration. Linting is run manually and by CI.
default_install_hook_types: [pre-push]

exclude: |
  (?x)^(
    \.editorconfig|
    Directory\.Packages\.props
  )$

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  # Structural validation
  - id: check-xml
  - id: check-yaml
    args: [--allow-multiple-documents]
  - id: check-toml
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-added-large-files
    args: [--maxkb=150]
  - id: end-of-file-fixer
  - id: trailing-whitespace
- repo: https://gitlab.com/bmares/check-json5
  rev: v1.0.1
  hooks:
  - id: check-json5
- repo: https://github.com/rbubley/mirrors-prettier
  rev: v3.9.10
  hooks:
  #JSON formatting; indentation and line endings come from .editorconfig. Tool-written
  #manifests and lockfiles are left to the tools that generate them.
  - id: prettier
    types_or: [json]
    exclude: |
      (?x)(
        (^|/)devcontainer-lock\.json$|
        (^|/)package-lock\.json$|
        (^|/)\.config/dotnet-tools\.json$
      )
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.50.0
  hooks:
  - id: markdownlint
    args: ["--disable", "MD013", "--disable", "MD034", "--"]
