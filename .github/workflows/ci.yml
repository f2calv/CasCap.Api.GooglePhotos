name: ci

on:
  workflow_dispatch:
    inputs:
      push-preview:
        type: boolean
        description: Push a pre-release NuGet package from a non-default branch?
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

#Deny all by default; each job grants only the scopes it needs.
permissions: {}

jobs:
  #Lint, versioning, build/test/pack/push and release in one shared workflow; grant the union of its permissions.
  ci:
    uses: f2calv/gha-workflows/.github/workflows/dotnet-nuget-library.yml@v1
    permissions:
      contents: write
      id-token: write #OIDC token for NuGet Trusted Publishing
      packages: write #push to nuget.pkg.github.com
    with:
      solution-name: CasCap.Api.GooglePhotos.Release.slnx
      #The nuget.org username matches the GitHub owner. If they ever diverge this must
      #become a literal, or the token exchange fails with an opaque 401.
      nuget-user: ${{ github.repository_owner }}
      #Dispatch-only input: other events must not forward its empty value.
      push-preview: ${{ github.event_name == 'workflow_dispatch' && inputs.push-preview }}
      #Integration tests require interactive OAuth or a short-lived user token, the rest are credential-free.
      dotnet-test-args: '["--filter-not-trait", "Category=Integration"]'
